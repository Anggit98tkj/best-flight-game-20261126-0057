<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valley Wing: Sky Courier</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a1626; height: 100%; overflow: hidden; }

<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Valley Wing: arrows fly, W/S throttle, Space brake, G gear, F flaps, P pause, M sound, R restart. Plays offline.</div>
</div>
